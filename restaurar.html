function restaurar(){
  var s=document.getElementById('status');
  var d=document.getElementById('detalhe');
  s.textContent='Decodificando dados...';
  s.style.color='#856404';
  var dados=atob(b64);
  var p=JSON.parse(dados);
  s.textContent='Enviando '+p.compras.length+' compras para o servidor...';
  d.textContent='Tamanho: '+(dados.length/1024).toFixed(0)+' KB';
  
  // Envia como JSON no body (sem FormData)
  fetch(API_URL+'?action=save&empresa=matriz', {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: dados
  })
  .then(function(r){return r.json();})
  .then(function(res){
    d.textContent='Resposta: '+JSON.stringify(res);
    if(res.ok){
      s.textContent='SUCESSO! '+p.compras.length+' compras e '+p.vendas.length+' vendas restauradas!';
      s.style.color='#155724';
    } else {
      s.textContent='Erro: '+JSON.stringify(res);
      s.style.color='red';
    }
  }).catch(function(e){
    s.textContent='Erro de conexao: '+e;
    d.textContent='Verifique o console (F12)';
    s.style.color='red';
  });
}
